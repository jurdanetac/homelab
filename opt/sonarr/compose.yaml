services:
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    network_mode: "host"
    environment:
      - UMASK=002
    volumes:
      - /opt/sonarr:/config
      - /mnt/toshiba-500:/toshiba-500
      - /mnt/toshiba-320:/toshiba-320
      - /mnt/sandisk-500:/sandisk-500
      - /mnt/seagate-320:/seagate-320
    restart: 'unless-stopped'
