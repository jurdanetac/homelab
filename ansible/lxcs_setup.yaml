- name: Prepare Alpine containers for Ansible access
  hosts: lxcs
  gather_facts: false


  tasks:
    - name: Wait for container network to wake up completely
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        delay: 3
        timeout: 30
      delegate_to: localhost

    - name: Update repositories and install the syncthing package
      community.general.apk:
        name: syncthing
        update_cache: true
    - name: Install OpenSSH Package
      ansible.builtin.command:
        cmd: "pct exec {{ vm_id }} -- apk update"
      delegate_to: proxmox_host
      
    - name: Install OpenSSH Package
      ansible.builtin.command:
        cmd: "pct exec {{ vm_id }} -- apk add openssh"
      delegate_to: proxmox_host

    - name: Enable SSH Boot Service
      ansible.builtin.command:
        cmd: "pct exec {{ vm_id }} -- rc-update add sshd default"
      delegate_to: proxmox_host

    - name: Start SSH Daemon Live
      ansible.builtin.command:
        cmd: "pct exec {{ vm_id }} -- rc-service sshd start"
      delegate_to: proxmox_host

    - name: Install Python 3
      ansible.builtin.command:
        cmd: "pct exec {{ vm_id }} -- apk add python3"
      delegate_to: proxmox_host
